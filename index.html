<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="src/css/main.css">
</head>
<body>
<body>
    <!-- Modal "Bienvenida" -->
    <div id="welcome-modal" class="modal-overlay">
        <div class="modal">
            <h2>💖</h2>
            <p>¡Eres el amor de mi vida!</p>
            <button id="modal-ok-btn" class="start-btn">Comenzar</button>
        </div>
    </div>

    <!-- Interfaz principal -->
    <div id="main-interface" class="screen">
        <div class="header">
            <i data-lucide="chevron-left"></i>
            <div class="profile-pic"></div>
            <div class="header-info">
                <span id="display-name">Oswald</span>
                <span id="typing-indicator" class="typing">escribiendo...</span>
            </div>
            <div class="header-actions">
                <i data-lucide="video"></i>
                <i data-lucide="phone"></i>
            </div>
        </div>
        <div id="chat-container"></div>
        <div class="footer">
            <i data-lucide="plus" class="icon-button"></i>
            <input type="text" id="message-input" class="input-box-chat" placeholder="Mensaje...">
            <i data-lucide="camera" class="icon-button"></i>
            <i data-lucide="send" id="send-btn" class="icon-button"></i>
        </div>
    </div>
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
